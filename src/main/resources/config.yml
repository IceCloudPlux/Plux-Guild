# ============================================================
#  Guild 插件核心配置文件
#  其他配置已拆分到独立文件：
#    features.yml    - 功能开关
#    currency.yml    - 货币系统
#    guild.yml       - 公会规则
#    experience.yml  - 经验获取
#    bank.yml        - 银行系统
#    gui.yml         - GUI界面
#    shop.yml         - 公会商店
#  修改后使用 /guild reload 重载（无需重启服务器）
# ============================================================

# ---------- 配置版本 ----------
config-version: 1.3

# ---------- 语言设置 ----------
# 可选值: zh_cn, zh_tw, en_us
language: zh_cn

# ---------- 数据库设置 ----------
database:
  # 数据库类型：sqlite / mysql
  type: sqlite

  # --- 仅 type=mysql 时需要 ---
  host: localhost
  port: 3306
  database: guild
  username: root
  password: ""
  pool-size: 10
  connection-timeout: 30000

# ---------- 调试设置 ----------
debug:
  enabled: false
  show-papi-info: true
