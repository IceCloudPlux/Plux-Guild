# ============================================================
#  Guild 公会商店配置文件
#  修改后使用 /guild reload 重载
# ============================================================

# ---------- 商店全局设置 ----------
settings:
  enabled: true                    # 是否启用公会商店
  title: "&6&l公会商店"            # 商店标题
  rows: 6                          # 商店界面行数 (1-6)
  show-locked-items: true         # 是否显示未达到等级要求的锁定商品
  locked-display-name: "&7[锁定]"  # 锁定商品的显示名称
  locked-lore:
    - "&c需要公会等级: %level%"
    - "&7公会达到 Lv.%level% 后解锁"

# ---------- 商品列表 ----------
# 每个商品支持以下字段:
#   slot:           商品在GUI中的位置 (0-53)
#   material:       物品材质 (Bukkit Material名称, 如 GOLD_INGOT)
#   name:           商品显示名称 (支持颜色代码 &)
#   lore:           商品描述 (列表, 支持颜色代码)
#   required-level: 购买所需公会等级
#   price:          购买价格
#   currency-type:  货币类型 (GUILD_COIN / VAULT / PLAYER_POINTS)
#   action:         购买后执行的动作类型:
#                     COMMAND   - 以玩家身份执行命令
#                     CONSOLE   - 以控制台身份执行命令
#                     GIVE_ITEM - 直接给予物品
#                     GUILD_EXP - 给予公会经验
#                     GUILD_COIN- 给予玩家公会币
#   action-value:   动作内容
#                     COMMAND/CONSOLE: 命令内容 (支持 %player% 占位符)
#                     GIVE_ITEM: 物品格式 material:amount:data (如 DIAMOND:3:0)
#                     GUILD_EXP: 经验数量
#                     GUILD_COIN: 公会币数量
#   buy-message:    购买成功后发送的消息 (支持颜色代码, 留空则不发送)
#   permission:     购买所需权限 (留空则无限制)

