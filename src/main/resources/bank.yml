# ============================================================
#  Guild 银行系统配置
#  修改后使用 /guild reload 重载
# ============================================================

# ---------- 银行限额 ----------
# 单次存款上限（0 = 无限制）
max-deposit: 0
# 单次取款上限（0 = 无限制）
max-withdraw: 0
# 银行余额上限（0 = 无限制）
max-balance: 0
# 银行最低保留余额（取款后至少保留的金额）
min-balance: 0

# ---------- 税率 ----------
# 存款税率（0.0 ~ 1.0，存款时扣除的比例）
# 例: 0.05 表示存入1000实际到账950
deposit-tax: 0.0
# 取款税率（0.0 ~ 1.0，取款时扣除的比例）
# 例: 0.05 表示取1000实际获得950
withdraw-tax: 0.0

# ---------- 权限限制 ----------
# 最低可取款职位: MEMBER / OFFICER / OWNER
withdraw-permission: OFFICER
# 最低可存款职位
deposit-permission: MEMBER

# ---------- 日限额 ----------
# 每日存款上限（0 = 无限制）
daily-deposit-limit: 0
# 每日取款上限（0 = 无限制）
daily-withdraw-limit: 0

# ---------- 利息 ----------
interest:
  enabled: false
  # 利率（0.01 = 1%每日）
  rate: 0.01
  # 利息计算时间（24小时制，如 04:00 表示凌晨4点）
  time: "04:00"
  # 利息上限（0 = 无限制）
  max-interest: 0

# ---------- 记录 ----------
# 保存最近多少条交易记录
max-history-records: 50
# 是否在控制台记录大额交易
log-large-transactions: true
# 大额交易阈值
large-transaction-threshold: 50000
